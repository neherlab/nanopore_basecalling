name: nanopore_basecalling
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.11
  - snakemake>=9
  # 2.7.0 stopped adding `--ntasks-per-gpu=1` to every GPU job, which used to
  # start one copy of the basecalling job per requested GPU.
  - snakemake-executor-plugin-slurm>=2.7.0
  - biopython
  - click
  - matplotlib
  - numpy
  - pandas
  - samtools
  - seaborn
