# Default settings for the basecalling pipeline: where the toolchain lives, and how to
# basecall unless a run says otherwise.
#
# What a particular run *is* — the kit, the flow cell, what was on it — does not belong
# here. It goes in `run.yaml` inside the run folder, next to the data. Settings are read
# in three layers, each overriding the one before it:
#
#   config/config.yaml    this file
#   <run_dir>/run.yaml    the run folder
#   --config key=value    the command line
#
# So a one-off experiment is
#   snakemake --profile cluster --config run_dir=<run> model=<other model>
# and a lasting choice for one run is a line in that run's run.yaml.

# Dorado toolchain
dorado_bin: "softwares/dorado-2.1.1-linux-x64/bin/dorado"
models_dir: "softwares/dorado_models"

# The basecalling model, as <tier>@<version>: the chemistry that completes the name is
# read off the run's flow cell and kit. A full dorado model name also works.
# e.g. "dna_r10.4.1_e8.2_400bps_sup@v5.2.0"
model: "sup@v5.2.0"

# Modified bases to call alongside the sequence, as a comma separated list of dorado
# modification codes — "4mC_5mC,6mA". Empty calls none. The models are worked out from
# `model`, and dorado allows only one modification per canonical base, so 4mC_5mC and
# 6mA go together but 5mC_5hmC and 5mCG_5hmCG do not. Anything wrong here stops the run
# before it starts. Any modification at all keeps the per-barcode bam files in final/bam,
# since fastq cannot carry the modification tags.
modifications: ""
