# Default settings for the basecalling pipeline.
#
# Override individual values on the command line:
#   snakemake --profile cluster --config run_dir=<run> kit=SQK-RBK114-96
# or point at your own file:
#   snakemake --profile cluster --config run_dir=<run> --configfile my_config.yaml

# Dorado toolchain
dorado_bin: "softwares/dorado-2.1.1-linux-x64/bin/dorado"
models_dir: "softwares/dorado_models"
model: "dna_r10.4.1_e8.2_400bps_sup@v5.2.0"
# Modified-base model, used by methylation.smk only. Its version is tied to `model`,
# so the two have to be changed together.
mods_model: "dna_r10.4.1_e8.2_400bps_sup@v5.2.0_6mA@v1"

# Sequencing protocol. The number of barcodes is taken from the kit name suffix.
kit: "SQK-RBK114-24"
flow_cell: "FLO-MIN114"
