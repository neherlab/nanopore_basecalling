# Fallback profile for when the a100 queue is too long: identical to cluster/ except
# that `basecall` asks for CPUs instead of GPUs. Dorado is called without `-x`, so it
# defaults to `auto` and, finding no GPU in the allocation, basecalls on the CPU.
#
# CPU basecalling is slow: on 32 cores `fast` does
# ~1.6e6 samples/s, about 2 h per Gbp, `hac` ~2.5e5, about 15 h per Gbp, and `sup` is
# out of reach. One A100 does `sup` at ~1.2e7, about 20 min per Gbp. So this is for small runs, with the fast model:
#   snakemake --profile cluster-cpu --config run_dir=<run> model=fast@v5.2.0

executor: slurm
jobs: 25
latency-wait: 90

slurm-efficiency-report: True
slurm-efficiency-report-path: "efficiency_reports"

software-deployment-method: conda
rerun-incomplete: True
printshellcmds: False
keep-going: False

# Measured: 32 cores with 16 runners is the fastest; 64 cores add nothing.
set-threads:
  basecall: 32

default-resources:
  runtime: 29
  mem_mb: 4000
  qos: "30min"

set-resources:
  basecall:
    # Left to itself dorado sizes its CPU runners from the whole node, not this
    # allocation: fast took 30 GB and hac was killed at 64 GB. 16 runners measured
    # 9 GB for fast; hac at 16 runners needs more than 16 GB, hence the 32.
    cpu_runners: 16
    # The week limit (less a margin, like the other rules) rather than a day: a run that
    # hits the wall loses everything, and a day holds only ~1.5 Gbp of hac.
    runtime: 10070
    mem_mb: 32000
    nodes: 1
    qos: "1week"
  demultiplex:
    runtime: 355
    qos: "6hours"
    mem_mb: 16000
  combine_stats:
    mem_mb: 16000
  make_plots_lengths:
    mem_mb: 16000
  make_plots_quality:
    mem_mb: 16000
